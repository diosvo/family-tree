name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 🚀 Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage

  e2e:
    name: 🧪 End-to-end tests
    runs-on: ubuntu-latest
    env:
      # Throwaway values: the dev server keeps its data in a local file
      # seeded for the tests (see playwright.config.ts), never in Vercel Blob.
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      ADMIN_PASSCODE: ci-only-passcode
      E2E_WRITES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
